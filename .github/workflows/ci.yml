name: CI Suite

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-suite:
    runs-on: ubuntu-latest

    env:
      OPENAI_API_KEY: "mock-key-for-ci"
      AGENT_API_TOKEN: "test-token"
      DASHBOARD_API_KEY: "test-token"
      MEMORY_COMPACTION_MODEL: "gpt-4o-mini"
      MEMORY_COMPACTION_THRESHOLD: "12"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Lean 4 via elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:stable
          echo "$HOME/.elan/bin" >> $GITHUB_PATH

      - name: Install Core & Test Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio httpx

      - name: Validate Lean 4 Kernel Sanity
        run: |
          lean --version
          echo "theorem ci_sanity : 1 + 1 = 2 := rfl" | lean --stdin

      - name: Run WebAssembly Fuel & Memory Sandbox Tests
        run: |
          python test_wasm_sandbox.py

      - name: Execute Pytest Suite (AST, Lean 4, ASGI)
        run: |
          python -m pytest

      - name: Install Promtool
        run: |
          PROM_VERSION="2.54.1"
          curl -LO "https://github.com/prometheus/prometheus/releases/download/v${PROM_VERSION}/prometheus-${PROM_VERSION}.linux-amd64.tar.gz"
          tar -xzf "prometheus-${PROM_VERSION}.linux-amd64.tar.gz"
          sudo mv "prometheus-${PROM_VERSION}.linux-amd64/promtool" /usr/local/bin/
          rm -rf prometheus-*

      - name: Verify Alert Rule Syntax & Execute Tests
        run: |
          promtool check rules deploy/prometheus-alerts.yml
          promtool test rules tests/test_prometheus_alerts.yml

      - name: Run Pre-Flight Diagnostics Check
        run: |
          python preflight.py || true

