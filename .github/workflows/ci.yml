name: CI Suite

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-suite:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Lean 4 via elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:stable
          echo "$HOME/.elan/bin" >> $GITHUB_PATH

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest httpx

      - name: Validate Lean 4 Kernel
        run: |
          lean --version
          echo "theorem ci_sanity : 1 + 1 = 2 := rfl" | lean --stdin

      - name: Run WebAssembly Sandbox Unit Tests
        run: |
          python test_wasm_sandbox.py

      - name: Run Pytest Test Suite
        run: |
          python -m pytest tests/ -v

      - name: Run Pre-Flight Diagnostics
        env:
          OPENAI_API_KEY: "mock-key-for-ci"
          AGENT_API_TOKEN: "ci-test-token"
        run: |
          python preflight.py || true
