services:
  agent:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: continuous-agent
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      # Persist the SQLite evolution database across container restarts
      - agent_data:/app/data
      - /var/run/docker.sock:/var/run/docker.sock # Optional: allows fallback gVisor sibling containers
    environment:
      - DB_PATH=/app/data/agent_state.db
      - DASHBOARD_HOST=0.0.0.0
      - DASHBOARD_PORT=8000
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/scheduler/status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

volumes:
  agent_data:
    driver: local
