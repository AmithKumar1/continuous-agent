version: '3.8'

services:
  agent:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: continuous-agent
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DB_PATH=/app/data/agent_state.db
      - AGENT_DB_PATH=/app/data/agent_state.db
    volumes:
      - agent_data:/app/data
      - chroma_data:/app/chroma_data

  zap:
    image: ghcr.io/zaproxy/zaproxy:stable
    container_name: zap-daemon
    restart: unless-stopped
    ports:
      - "8080:8080"
    command: zap.sh -daemon -host 0.0.0.0 -port 8080 -config api.disablekey=true -config api.addrs.addr.name=.* -config api.addrs.addr.regex=true

volumes:
  agent_data:
  chroma_data:
